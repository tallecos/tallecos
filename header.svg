  <!-- barra de destaque sob o nome -->
  <rect x="44" y="190" width="0" height="4" rx="2" fill="#bb9af7">
    <animate attributeName="width" from="0" to="515" begin="1.5s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1" values="0;515"/>
  </rect>

  <!-- taglines bilingues -->
  <g font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="19">
    <text x="44" y="232" fill="#565f89" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/>// estudante de Ciencia da Computacao, rumo a dev backend
    </text>
    <text x="44" y="262" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.3s" fill="freeze"/><tspan fill="#bb9af7">const</tspan> <tspan fill="#c0caf5">goal</tspan> <tspan fill="#565f89">=</tspan> <tspan fill="#9ece6a">'learning backend, one commit at a time'</tspan><tspan fill="#c0caf5">;</tspan>
    </text>
    <!-- cursor piscando -->
    <rect x="44" y="276" width="11" height="3" fill="#7aa2f7" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.1s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="2.6s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
