<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Talles Castro — estudante de Ciencia da Computacao rumo a dev backend">
  <title>Talles Castro — rumo a dev backend / toward backend dev</title>
  <defs>
    <linearGradient id="gradPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#13131c"/>
    </linearGradient>
    <linearGradient id="gradNome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="revelaNome">
      <rect x="40" y="118" width="0" height="80">
        <animate attributeName="width" from="0" to="531" begin="0.7s" dur="0.75s"
          fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1" values="0;531"/>
      </rect>
    </clipPath>
  </defs>

  <!-- janela do terminal -->
  <rect x="5" y="5" width="1190" height="290" rx="16" fill="url(#gradPanel)" stroke="#2a2e45" stroke-width="1.5"/>
  <!-- barra de titulo -->
  <circle cx="40" cy="40" r="7" fill="#f7768e"/>
  <circle cx="64" cy="40" r="7" fill="#e0af68"/>
  <circle cx="88" cy="40" r="7" fill="#9ece6a"/>
  <text x="120" y="45" font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#565f89">tallecos@github : ~/dev</text>
  <rect x="916" y="40" width="18" height="18" rx="4" fill="#565f89" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="942" y="40" width="18" height="18" rx="4" fill="#2a4a3a" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.12s" repeatCount="indefinite"/></rect><rect x="968" y="40" width="18" height="18" rx="4" fill="#9ece6a" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.24s" repeatCount="indefinite"/></rect><rect x="994" y="40" width="18" height="18" rx="4" fill="#6bbf4a" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.36s" repeatCount="indefinite"/></rect><rect x="1020" y="40" width="18" height="18" rx="4" fill="#9ece6a" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.48s" repeatCount="indefinite"/></rect><rect x="1046" y="40" width="18" height="18" rx="4" fill="#e0af68" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.60s" repeatCount="indefinite"/></rect><rect x="1072" y="40" width="18" height="18" rx="4" fill="#9ece6a" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.72s" repeatCount="indefinite"/></rect><rect x="1098" y="40" width="18" height="18" rx="4" fill="#565f89" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.84s" repeatCount="indefinite"/></rect><rect x="1124" y="40" width="18" height="18" rx="4" fill="#7dcfff" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.96s" repeatCount="indefinite"/></rect><rect x="1150" y="40" width="18" height="18" rx="4" fill="#9ece6a" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="1.08s" repeatCount="indefinite"/></rect>
  <line x1="24" y1="68" x2="1176" y2="68" stroke="#2a2e45" stroke-width="1"/>

  <!-- prompt -->
  <g font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="18">
    <text x="40" y="104" fill="#9ece6a" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.2s" fill="freeze"/>$ <tspan fill="#c0caf5">node</tspan> <tspan fill="#7dcfff">whoami.js</tspan>
    </text>
  </g>

